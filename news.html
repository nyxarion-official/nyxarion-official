<!DOCTYPE html>
<html>
<head>
<title>Nyxarion News</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#05060a;
    color:white;
    opacity:0;
    animation:fadeIn 0.8s forwards;
}

/* FADE IN */
@keyframes fadeIn{
    to{opacity:1;}
}

/* NAV */
nav{
    display:flex;
    justify-content:center;
    gap:10px;
    padding:15px;
    background:rgba(0,0,0,0.6);
}

/* TITLE */
h1{
    text-align:center;
    color:#00f0ff;
    margin-top:20px;
}

/* CONTAINER */
.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

/* NEWS CARDS */
.card{
    background:rgba(255,255,255,0.05);
    padding:15px;
    margin:15px 0;
    border-radius:12px;

    transform:translateY(20px);
    opacity:0;
    animation:slideUp 0.6s forwards;
}

/* stagger effect */
.card:nth-child(1){animation-delay:0.2s;}
.card:nth-child(2){animation-delay:0.4s;}
.card:nth-child(3){animation-delay:0.6s;}

@keyframes slideUp{
    to{
        transform:translateY(0);
        opacity:1;
    }
}

button{
    padding:8px 12px;
    border:none;
    background:#1f2937;
    color:white;
}
</style>

</head>

<body>

<nav>
<button onclick="location.href='home.html'">Home</button>
<button onclick="location.href='games.html'">Games</button>
<button onclick="location.href='news.html'">News</button>
<button onclick="location.href='profile.html'">Profile</button>
</nav>

<h1>GAMING NEWS</h1>

<div class="container">

<div class="card">
<h2>PUBG Mobile Update</h2>
New season introduces improved matchmaking and weapon balancing changes.
</div>

<div class="card">
<h2>GTA VI Development</h2>
Rockstar continues development with expected next-gen open world features.
</div>

<div class="card">
<h2>Wuthering Waves Update</h2>
New characters and combat improvements added in latest patch.
</div>

</div>

</body>
</html>
