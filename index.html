<!DOCTYPE html>
<html>
<head>
<title>Nyxarion Entry</title>

<style>
body{
    margin:0;
    height:100vh;
    overflow:hidden;
    font-family:Arial;
    background:black;
}

/* BACKGROUND */
.bg{
    position:absolute;
    width:100%;
    height:100%;
    background:url('https://images.unsplash.com/photo-1520975916090-3105956dac38') center/cover no-repeat;
    filter:brightness(0.4);
}

/* CENTER TEXT */
.center{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    color:white;
}

/* TITLE */
h1{
    font-size:50px;
    color:#a855f7;
    text-shadow:0 0 20px #a855f7;
    letter-spacing:3px;
}

/* PRESS ENTER */
.enter{
    margin-top:20px;
    font-size:18px;
    opacity:0.8;
    animation:blink 1.2s infinite;
    cursor:pointer;
}

@keyframes blink{
    0%,100%{opacity:1;}
    50%{opacity:0.2;}
}

/* GLOW LINE EFFECT */
.line{
    width:200px;
    height:2px;
    background:#00f0ff;
    margin:20px auto;
    box-shadow:0 0 15px #00f0ff;
}
</style>

</head>

<body onclick="enter()">

<div class="bg"></div>

<div class="center">
    <h1>NYXARION</h1>
    <div class="line"></div>
    <div class="enter">PRESS ANYWHERE TO ENTER</div>
</div>

<script>
function enter(){
    window.location.href="home.html";
}
</script>

</body>
</html>
