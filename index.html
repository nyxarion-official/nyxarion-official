<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NYXARION</title>
{shared_head}
<style>
body{{display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;overflow:hidden;}}
.intro-bg{{position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 50%,rgba(123,47,255,0.15) 0%,transparent 70%);}}
.grid{{position:fixed;inset:0;background-image:linear-gradient(rgba(123,47,255,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(123,47,255,0.06) 1px,transparent 1px);background-size:60px 60px;animation:gm 20s linear infinite;}}
@keyframes gm{{to{{background-position:60px 60px;}}}}
canvas{{position:fixed;inset:0;pointer-events:none;}}
.content{{position:relative;z-index:2;}}
.tag{{font-size:11px;letter-spacing:6px;color:var(--purple2);text-transform:uppercase;margin-bottom:24px;opacity:0;animation:up 0.8s 0.3s forwards;}}
.title{{font-family:'Orbitron',monospace;font-size:clamp(60px,12vw,130px);font-weight:900;line-height:0.9;letter-spacing:8px;background:linear-gradient(135deg,#fff 0%,var(--purple2) 40%,var(--blue2) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 60px rgba(123,47,255,0.4));opacity:0;animation:up 0.8s 0.5s forwards;}}
.sub{{font-size:clamp(11px,2vw,15px);letter-spacing:4px;color:var(--muted);text-transform:uppercase;margin-top:20px;opacity:0;animation:up 0.8s 0.7s forwards;}}
.enter{{margin-top:60px;padding:16px 60px;background:transparent;border:1px solid var(--purple);color:var(--purple2);font-family:'Orbitron',monospace;font-size:13px;letter-spacing:4px;text-transform:uppercase;cursor:pointer;position:relative;overflow:hidden;opacity:0;animation:up 0.8s 1s forwards;transition:all 0.3s;text-decoration:none;display:inline-block;}}
.enter::before{{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--purple),var(--blue));opacity:0;transition:opacity 0.3s;}}
.enter:hover::before{{opacity:1;}}
.enter:hover{{color:#fff;box-shadow:0 0 40px var(--glow);}}
.enter span{{position:relative;z-index:1;}}
@keyframes up{{from{{opacity:0;transform:translateY(30px);}}to{{opacity:1;transform:translateY(0);}}}}
</style>
</head>
<body>
<div id="cur"></div><div id="cur2"></div>
<div class="stars"></div>
<div class="intro-bg"></div>
<div class="grid"></div>
<canvas id="c"></canvas>
<div class="content">
  <div class="tag">Welcome to the Arena</div>
  <div class="title">NYXARION</div>
  <div class="sub">Gaming · News · Culture · Community</div>
  <a href="home.html" class="enter"><span>ENTER THE REALM</span></a>
</div>
{shared_js}
<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d');
cv.width=window.innerWidth;cv.height=window.innerHeight;
window.addEventListener('resize',()=>{{cv.width=window.innerWidth;cv.height=window.innerHeight;}});
const pts=Array.from({{length:60}},()=>{{return{{x:Math.random()*cv.width,y:Math.random()*cv.height,vx:(Math.random()-.5)*0.4,vy:(Math.random()-.5)*0.4,size:Math.random()*1.5+0.3,color:`hsl(${{260+Math.random()*60}},80%,70%)`}};}});
function draw(){{cx.clearRect(0,0,cv.width,cv.height);pts.forEach(p=>{{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>cv.width)p.vx*=-1;if(p.y<0||p.y>cv.height)p.vy*=-1;cx.beginPath();cx.arc(p.x,p.y,p.size,0,Math.PI*2);cx.fillStyle=p.color;cx.globalAlpha=0.5;cx.fill();}});requestAnimationFrame(draw);}}
draw();
</script>
</body></html>
