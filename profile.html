<!DOCTYPE html>
<html>
<head>
<title>Nyxarion Profile</title>

<style>
body{
    margin:0;
    font-family:Arial;
    color:white;
    overflow:hidden;
}

/* CYBER BACKGROUND */
.bg{
    position:absolute;
    width:200%;
    height:200%;
    background:
    linear-gradient(transparent 95%, rgba(0,255,255,0.15) 100%),
    linear-gradient(90deg, transparent 95%, rgba(0,255,255,0.15) 100%);
    background-size:60px 60px;
    animation:move 7s linear infinite;
    opacity:0.35;
}

@keyframes move{
    from{transform:translate(0,0);}
    to{transform:translate(-60px,-60px);}
}

/* PROFILE BOX */
.box{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;

    background:rgba(0,0,0,0.7);
    padding:40px;
    border-radius:18px;

    box-shadow:0 0 25px rgba(0,255,255,0.4);

    animation:pop 0.8s ease;
}

@keyframes pop{
    from{transform:translate(-50%,-50%) scale(0.8);opacity:0;}
    to{transform:translate(-50%,-50%) scale(1);opacity:1;}
}

/* TEXT IMPROVEMENTS */
h1{
    color:#00f0ff;
    font-size:38px;
    text-shadow:0 0 15px #00f0ff;
}

p{
    font-size:20px;
    line-height:1.8;
}

.highlight{
    color:#a855f7;
    font-weight:bold;
}
</style>

</head>

<body>

<div class="bg"></div>

<div class="box">

<h1>PLAYER PROFILE</h1>

<p><span class="highlight">Name:</span> M. Faakhir Zaki</p>
<p><span class="highlight">Email:</span> faakhir.zaki2@gmail.com</p>

<hr style="opacity:0.3;">

<p><span class="highlight">Collaborators:</span></p>
<p style="font-size:22px;">
Muneeb • Fozvee • Nomi
</p>

</div>

</body>
</html>
