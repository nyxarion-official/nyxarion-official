<!DOCTYPE html>

<title>Nyxarion Profile</title>

<style>
body{
    margin:0;
    font-family:Arial;
    color:white;
    overflow:hidden;
}

/* ANIMATED BACKGROUND */
.bg{
    position:absolute;
    width:200%;
    height:200%;
    background:
    linear-gradient(transparent 95%, rgba(0,255,255,0.2) 100%),
    linear-gradient(90deg, transparent 95%, rgba(0,255,255,0.2) 100%);
    background-size:50px 50px;
    animation:move 6s linear infinite;
    opacity:0.3;
}

@keyframes move{
    from{transform:translate(0,0);}
    to{transform:translate(-50px,-50px);}
}

/* CENTER BOX */
.box{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    background:rgba(0,0,0,0.6);
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,255,255,0.3);
}

/* TITLE */
h1{
    color:#00f0ff;
    text-shadow:0 0 15px #00f0ff;
}
</style>

</head>
