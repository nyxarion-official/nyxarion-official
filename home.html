<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nyxarion - Home</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at center, #12002b, #05060a);
    color: white;
}

/* NAVBAR */
nav {
    display: flex;
    justify-content: center;
    gap: 15px;
    padding: 15px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
}

nav button {
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    background: #1f2937;
    color: white;
    cursor: pointer;
}

nav button:hover {
    background: #a855f7;
}

/* HERO SECTION */
.hero {
    height: 60vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.hero h1 {
    font-size: 60px;
    color: #a855f7;
    text-shadow: 0 0 20px #a855f7;
    margin-bottom: 10px;
}

/* CENTER BUTTONS */
.center-buttons {
    display: flex;
    gap: 20px;
    margin-top: 20px;
}

.center-buttons button {
    padding: 15px 25px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: transparent;
    color: white;
    border: 1px solid #a855f7;
    transition: 0.3s;
}

.center-buttons button:hover {
    background: #a855f7;
    box-shadow: 0 0 20px #a855f7;
}

/* SECTIONS */
section {
    padding: 40px 20px;
    text-align: center;
}

.card {
    background: rgba(255,255,255,0.05);
    padding: 15px;
    border-radius: 10px;
    margin-top: 10px;
}
</style>

</head>

<body>

<!-- NAV -->
<nav>
    <button onclick="location.href='games.html'">Games</button>
    <button onclick="location.href='news.html'">News</button>
    <button onclick="location.href='profile.html'">Profile</button>
</nav>

<!-- HERO -->
<div class="hero">
    <h1>NYXARION</h1>
    <p>A Cyber Gaming Universe</p>

    <!-- CENTER BUTTONS -->
    <div class="center-buttons">
        <button onclick="location.href='games.html'">Games</button>
        <button onclick="location.href='news.html'">News</button>
        <button onclick="location.href='profile.html'">Profile</button>
    </div>
</div>

<!-- SIMPLE PREVIEW -->
<section>
    <h2>Welcome</h2>
    <div class="card">
        Explore games, latest gaming news, and your profile in the Nyxarion universe.
    </div>
</section>

</body>
</html>
