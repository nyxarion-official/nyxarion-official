<!DOCTYPE html>
<html>
<head>
<title>Nyxarion Launcher</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#05060a;
    color:white;
}

/* TOP BAR */
.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 20px;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(10px);
}

.logo{
    font-size:20px;
    color:#a855f7;
    text-shadow:0 0 10px #a855f7;
}

/* MAIN GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:30px;
}

/* BIG LAUNCH CARDS */
.card{
    height:200px;
    border-radius:15px;
    background:rgba(255,255,255,0.05);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    cursor:pointer;
    transition:0.3s;
    border:1px solid rgba(255,255,255,0.1);
}

.card:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px rgba(168,85,247,0.4);
}

.card h2{
    color:#00f0ff;
}

/* BOTTOM PREVIEW */
.preview{
    padding:20px;
    text-align:center;
    opacity:0.8;
}
</style>

</head>

<body>

<div class="topbar">
<div class="logo">NYXARION LAUNCHER</div>
<div>
<button onclick="location.href='games.html'">Games</button>
<button onclick="location.href='news.html'">News</button>
<button onclick="location.href='profile.html'">Profile</button>
</div>
</div>

<div class="grid">

<div class="card" onclick="location.href='games.html'">
<h2>🎮 GAMES</h2>
<p>Launch your gaming universe</p>
</div>

<div class="card" onclick="location.href='news.html'">
<h2>📰 NEWS</h2>
<p>Latest gaming updates & events</p>
</div>

<div class="card" onclick="location.href='profile.html'">
<h2>👤 PROFILE</h2>
<p>Your identity in Nyxarion world</p>
</div>

</div>

<div class="preview">
Welcome to Nyxarion — a unified gaming launcher experience inspired by modern game platforms.
</div>

</body>
</html>
