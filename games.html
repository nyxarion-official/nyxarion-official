<!DOCTYPE html>
<html>
<head>
<title>Nyxarion - Games Library</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#05060a;
    color:white;
}

/* TOP BAR */
nav{
    display:flex;
    justify-content:center;
    gap:10px;
    padding:15px;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(10px);
}

nav button{
    padding:8px 12px;
    border:none;
    background:#1f2937;
    color:white;
    cursor:pointer;
}

/* TITLE */
h1{
    text-align:center;
    color:#00f0ff;
    margin-top:20px;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
    padding:30px;
}

/* GAME TILE */
.game{
    height:280px;
    border-radius:15px;
    overflow:hidden;
    position:relative;
    cursor:pointer;
    transition:0.3s;
    border:1px solid rgba(255,255,255,0.1);
}

.game:hover{
    transform:scale(1.05);
    box-shadow:0 0 25px rgba(0,240,255,0.4);
}

/* IMAGE */
.game img{
    width:100%;
    height:100%;
    object-fit:cover;
    filter:brightness(0.8);
}

/* TITLE OVERLAY */
.label{
    position:absolute;
    bottom:10px;
    left:10px;
    font-size:18px;
    font-weight:bold;
    color:white;
    text-shadow:0 0 10px black;
}
</style>

</head>

<body>

<nav>
<button onclick="location.href='home.html'">Home</button>
<button onclick="location.href='games.html'">Games</button>
<button onclick="location.href='news.html'">News</button>
<button onclick="location.href='profile.html'">Profile</button>
</nav>

<h1>GAMES LIBRARY</h1>

<div class="grid">

<!-- PUBG -->
<div class="game" onclick="location.href='pubg.html'">
<img src="https://upload.wikimedia.org/wikipedia/en/4/44/PUBG_Mobile_logo.jpg">
<div class="label">PUBG MOBILE</div>
</div>

<!-- WUTHERING WAVES -->
<div class="game" onclick="location.href='wuthering.html'">
<img src="https://images.unsplash.com/photo-1605902711622-cfb43c4437d1">
<div class="label">WUTHERING WAVES</div>
</div>

<!-- GTA -->
<div class="game" onclick="location.href='gta.html'">
<img src="https://images.unsplash.com/photo-1533236897111-3e94666b2edf">
<div class="label">GTA V</div>
</div>

</div>

</body>
</html>
