<!DOCTYPE html>
<html>
<head>
<title>Nyxarion Games Library</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#05060a;
    color:white;
}

/* AUDIO UI (hidden) */
audio{display:none;}

/* TOP BAR */
nav{
    display:flex;
    justify-content:center;
    gap:12px;
    padding:15px;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(10px);
    position:sticky;
    top:0;
    z-index:1000;
}

nav button{
    padding:10px 14px;
    border:none;
    background:#1f2937;
    color:white;
    cursor:pointer;
    transition:0.3s;
}

nav button:hover{
    background:#a855f7;
    transform:scale(1.05);
}

/* TITLE */
h1{
    text-align:center;
    color:#00f0ff;
    font-size:42px;
    margin-top:20px;
    text-shadow:0 0 15px #00f0ff;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    padding:30px;
}

/* GAME CARD */
.game{
    height:300px;
    border-radius:15px;
    overflow:hidden;
    position:relative;
    cursor:pointer;
    transition:0.4s;

    opacity:0;
    transform:translateY(30px);
    animation:slideIn 0.6s forwards;
}

.game:nth-child(1){animation-delay:0.2s;}
.game:nth-child(2){animation-delay:0.4s;}
.game:nth-child(3){animation-delay:0.6s;}

@keyframes slideIn{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.game:hover{
    transform:scale(1.06);
    box-shadow:0 0 25px rgba(0,240,255,0.4);
}

/* IMAGE */
.game img{
    width:100%;
    height:100%;
    object-fit:cover;
    filter:brightness(0.75);
}

/* LABEL */
.label{
    position:absolute;
    bottom:12px;
    left:12px;
    font-size:18px;
    font-weight:bold;
    text-shadow:0 0 10px black;
}

/* SOUND SCRIPT */
</style>
</head>

<body>

<!-- SOUND FILES -->
<audio id="clickSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8b6b5b0c8.mp3?filename=menu-click-110078.mp3"></audio>
<audio id="hoverSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_3b1c8c8f2d.mp3?filename=hover-112937.mp3"></audio>

<script>
function clickFx(){
    document.getElementById("clickSound").play();
}

function hoverFx(){
    document.getElementById("hoverSound").play();
}
</script>

<!-- NAV -->
<nav>
<button onmouseover="hoverFx()" onclick="clickFx(); location.href='home.html'">Home</button>
<button onmouseover="hoverFx()" onclick="clickFx(); location.href='games.html'">Games</button>
<button onmouseover="hoverFx()" onclick="clickFx(); location.href='news.html'">News</button>
<button onmouseover="hoverFx()" onclick="clickFx(); location.href='profile.html'">Profile</button>
</nav>

<h1>GAMES LIBRARY</h1>

<div class="grid">

<!-- PUBG -->
<div class="game" onmouseover="hoverFx()" onclick="clickFx(); location.href='pubg.html'">
<img src="https://upload.wikimedia.org/wikipedia/en/4/44/PUBG_Mobile_logo.jpg">
<div class="label">🎯 PUBG MOBILE</div>
</div>

<!-- WUTHERING WAVES -->
<div class="game" onmouseover="hoverFx()" onclick="clickFx(); location.href='wuthering.html'">
<img src="https://images.unsplash.com/photo-1605902711622-cfb43c4437d1">
<div class="label">⚡ WUTHERING WAVES</div>
</div>

<!-- GTA V -->
<div class="game" onmouseover="hoverFx()" onclick="clickFx(); location.href='gta.html'">
<img src="https://images.unsplash.com/photo-1533236897111-3e94666b2edf">
<div class="label">🚗 GTA V</div>
</div>

</div>

</body>
</html>
