<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NYXARION — Games</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&family=Exo+2:ital,wght@0,200;0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#04020f;--purple:#7b2fff;--purple2:#a855f7;--blue:#1e3aff;--blue2:#60a5fa;--glow:rgba(123,47,255,0.5);--text:#e8e0ff;--muted:#7a6ea0;--card:rgba(255,255,255,0.04);--border:rgba(123,47,255,0.25);}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;overflow-x:hidden;cursor:none;animation:fadeIn 0.5s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
#cur{position:fixed;width:10px;height:10px;background:var(--purple2);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);mix-blend-mode:screen;}
#cur2{position:fixed;width:30px;height:30px;border:1px solid rgba(168,85,247,0.5);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:left 0.12s,top 0.12s;}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--d) var(--del) ease-in-out infinite alternate;}
@keyframes twinkle{0%{opacity:0.1;}100%{opacity:0.8;}}
nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:0 40px;height:64px;display:flex;align-items:center;justify-content:space-between;background:rgba(4,2,15,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.nav-logo{font-family:'Orbitron',monospace;font-size:22px;font-weight:900;background:linear-gradient(135deg,var(--purple),var(--blue2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:4px;text-decoration:none;}
.nav-links{display:flex;gap:8px;}
.nav-btn{color:var(--muted);font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;padding:8px 16px;border-radius:4px;text-decoration:none;transition:all 0.2s;position:relative;}
.nav-btn:hover{color:var(--purple2);}
.nav-btn.active{color:var(--purple2);}
.nav-btn.active::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:60%;height:2px;background:var(--purple);border-radius:2px;}
.nav-mobile{display:none;background:none;border:none;color:var(--text);font-size:24px;cursor:pointer;}
#mob-menu{display:none;position:fixed;top:64px;left:0;right:0;background:rgba(4,2,15,0.97);z-index:999;padding:16px 24px;border-bottom:1px solid var(--border);}
#mob-menu a{display:block;padding:14px 0;color:var(--muted);text-decoration:none;font-family:'Rajdhani',sans-serif;font-size:14px;letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid var(--border);}
#mob-menu a:last-child{border-bottom:none;}
#mob-menu a:hover{color:var(--purple2);}
footer{background:rgba(7,4,26,0.8);border-top:1px solid var(--border);padding:40px 8%;text-align:center;margin-top:40px;}
.footer-logo{font-family:'Orbitron',monospace;font-size:24px;font-weight:900;background:linear-gradient(135deg,var(--purple),var(--blue2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:4px;margin-bottom:12px;}
.footer-text{font-size:12px;color:var(--muted);letter-spacing:2px;}
.btn-primary{padding:14px 36px;background:linear-gradient(135deg,var(--purple),var(--blue));color:#fff;border:none;font-family:'Orbitron',monospace;font-size:11px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;border-radius:2px;transition:all 0.3s;box-shadow:0 0 30px var(--glow);text-decoration:none;display:inline-block;}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 0 50px var(--glow);}
.btn-outline{padding:14px 36px;background:transparent;color:var(--purple2);border:1px solid var(--purple);font-family:'Orbitron',monospace;font-size:11px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;border-radius:2px;transition:all 0.3s;text-decoration:none;display:inline-block;}
.btn-outline:hover{background:rgba(123,47,255,0.1);transform:translateY(-2px);}
.section{padding:80px 8%;}
.section-tag{font-size:10px;letter-spacing:5px;color:var(--purple2);text-transform:uppercase;margin-bottom:12px;}
.section-title{font-family:'Orbitron',monospace;font-size:clamp(24px,4vw,40px);font-weight:700;margin-bottom:16px;}
.section-title span{color:var(--purple2);}
.section-line{width:60px;height:2px;background:linear-gradient(90deg,var(--purple),transparent);margin-bottom:40px;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--purple);border-radius:2px;}
@media(max-width:768px){nav{padding:0 20px;}.nav-links{display:none;}.nav-mobile{display:block;}.section{padding:60px 5%;}}
</style>
<style>
.page-hero{padding:110px 8% 40px;position:relative;text-align:center;}
.page-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 80% at 50% 0%,rgba(123,47,255,0.1) 0%,transparent 70%);}
.page-hero h1{font-family:'Orbitron',monospace;font-size:clamp(32px,6vw,64px);font-weight:900;position:relative;}
.page-hero h1 span{background:linear-gradient(135deg,var(--purple2),var(--blue2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.filter-bar{display:flex;gap:10px;padding:20px 8% 40px;flex-wrap:wrap;justify-content:center;}
.fb{padding:8px 20px;background:var(--card);border:1px solid var(--border);color:var(--muted);font-family:'Rajdhani',sans-serif;font-size:12px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border-radius:4px;transition:all 0.2s;}
.fb:hover,.fb.active{background:rgba(123,47,255,0.15);border-color:var(--purple);color:var(--purple2);}
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px;padding:0 8% 80px;}
.gc{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:all 0.3s;display:flex;flex-direction:column;}
.gc:hover{border-color:var(--purple);transform:translateY(-6px);box-shadow:0 30px 60px rgba(0,0,0,0.4),0 0 40px var(--glow);}
.gc-cover{height:200px;display:flex;align-items:center;justify-content:center;font-size:64px;position:relative;}
.gc-plat{position:absolute;top:12px;right:12px;display:flex;gap:6px;}
.pt{padding:3px 8px;background:rgba(4,2,15,0.8);border:1px solid var(--border);border-radius:3px;font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
.gc-info{padding:20px;display:flex;flex-direction:column;flex:1;}
.gc-genre{font-size:9px;letter-spacing:4px;color:var(--purple2);text-transform:uppercase;margin-bottom:8px;}
.gc-title{font-family:'Orbitron',monospace;font-size:16px;font-weight:700;margin-bottom:6px;}
.gc-desc{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:16px;flex:1;}
.gc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;}
.gc-rating{display:flex;align-items:center;gap:6px;font-size:13px;}
.sr{color:#fbbf24;font-size:12px;}
.gc-link{padding:7px 16px;background:linear-gradient(135deg,var(--purple),var(--blue));color:#fff;font-family:'Orbitron',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;text-decoration:none;border-radius:3px;transition:all 0.2s;white-space:nowrap;}
.gc-link:hover{box-shadow:0 0 20px var(--glow);transform:translateY(-1px);}
.hidden{display:none;}
@media(max-width:768px){.games-grid{padding:0 5% 60px;}.filter-bar{padding:20px 5% 30px;}}
</style>
</head>
<body>
<div id="cur"></div><div id="cur2"></div>
<div class="stars"></div>
<nav>
<a href="home.html" class="nav-logo">NYXARION</a>
<div class="nav-links"><a href="index.html" class="nav-btn ">HOME</a><a href="games.html" class="nav-btn active">GAMES</a><a href="news.html" class="nav-btn ">NEWS</a><a href="profile.html" class="nav-btn ">PROFILE</a></div>
<button class="nav-mobile" onclick="toggleMob()">☰</button>
</nav>
<div id="mob-menu"><a href="index.html">HOME</a><a href="games.html">GAMES</a><a href="news.html">NEWS</a><a href="profile.html">PROFILE</a></div>
<div class="page-hero">
<div class="section-tag">// Game Library</div>
<h1>All <span>Games</span></h1>
</div>
<div class="filter-bar">
<button class="fb active" onclick="filter('all',this)">All</button>
<button class="fb" onclick="filter('mobile',this)">Mobile</button>
<button class="fb" onclick="filter('pc',this)">PC</button>
<button class="fb" onclick="filter('console',this)">Console</button>
<button class="fb" onclick="filter('action',this)">Action</button>
<button class="fb" onclick="filter('rpg',this)">RPG</button>
<button class="fb" onclick="filter('openworld',this)">Open World</button>
</div>
<div class="games-grid" id="gg"></div>
<footer><div class="footer-logo">NYXARION</div><div class="footer-text">© 2026 Nyxarion · All Platforms · All Genres · All News</div></footer>
<script>
const cur=document.getElementById('cur'),cur2=document.getElementById('cur2');
document.addEventListener('mousemove',e=>{cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px';cur2.style.left=e.clientX+'px';cur2.style.top=e.clientY+'px';});
const s=document.querySelector('.stars');
for(let i=0;i<100;i++){const el=document.createElement('div');el.className='star';const sz=Math.random()*2+0.4;el.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--del:${Math.random()*4}s;`;s.appendChild(el);}
function toggleMob(){const m=document.getElementById('mob-menu');m.style.display=m.style.display==='none'?'block':'none';}
</script>
<script>
const games=[
{t:'GTA VI',g:'Action / Open World',p:['PC','Console'],tags:['action','openworld','pc','console'],e:'🚗',r:4.9,d:'The most anticipated open-world crime saga returns to Vice City with the biggest map ever.',c:'rgba(239,68,68,0.25),rgba(251,191,36,0.15)',url:'gta.html'},
{t:'PUBG Mobile',g:'Battle Royale',p:['Mobile'],tags:['action','mobile'],e:'🔫',r:4.7,d:'100-player battle royale on mobile — squad up and be the last team standing.',c:'rgba(234,179,8,0.25),rgba(123,47,255,0.15)',url:'pubg.html'},
{t:'Valorant Mobile',g:'Tactical FPS',p:['Mobile'],tags:['action','mobile'],e:'🎯',r:4.8,d:"Riot's tactical 5v5 FPS comes to mobile with full agent abilities and ranked play.",c:'rgba(239,68,68,0.3),rgba(30,58,255,0.15)',url:'valorant.html'},
{t:'Wuthering Waves',g:'Action RPG',p:['Mobile','PC'],tags:['rpg','action','mobile','pc'],e:'🌊',r:4.8,d:'Stunning open-world action RPG with fluid combat, deep lore and breathtaking environments.',c:'rgba(6,182,212,0.25),rgba(123,47,255,0.15)',url:'wuthering.html'},
{t:'Honor of Kings World',g:'MOBA / RPG',p:['Mobile','PC','Console'],tags:['action','rpg','mobile','pc','console'],e:'⚔️',r:4.6,d:'The legendary MOBA expands into a full open-world RPG across all platforms.',c:'rgba(251,191,36,0.25),rgba(239,68,68,0.15)',url:'honorofkings.html'},
{t:'Red Dead Redemption 2',g:'Open World / Western',p:['PC','Console'],tags:['openworld','rpg','pc','console'],e:'🤠',r:5.0,d:'The greatest open-world game ever made. A masterpiece of storytelling and immersion.',c:'rgba(180,83,9,0.3),rgba(120,53,15,0.2)',url:'rdr2.html'},
{t:'Hogwarts Legacy',g:'Action RPG',p:['PC','Console'],tags:['rpg','openworld','pc','console'],e:'⚡',r:4.7,d:'Explore Hogwarts in the 1800s, master spells, and uncover a hidden magical secret.',c:'rgba(123,47,255,0.3),rgba(251,191,36,0.15)',url:'hogwarts.html'},
{t:'Hogwarts Legacy 2',g:'Action RPG',p:['PC','Console'],tags:['rpg','openworld','pc','console'],e:'🦅',r:4.9,d:'The sequel expands the wizarding world with new regions, creatures, and deeper magic systems.',c:'rgba(168,85,247,0.3),rgba(96,165,250,0.15)',url:'hogwarts2.html'},
{t:'Minecraft',g:'Sandbox / Survival',p:['PC','Mobile','Console'],tags:['action','mobile','pc','console'],e:'⛏️',r:4.8,d:'The infinite sandbox where creativity has no limits. Build, survive, explore forever.',c:'rgba(34,197,94,0.25),rgba(120,53,15,0.15)',url:'minecraft.html'},
{t:'Call of Duty Mobile',g:'FPS / Battle Royale',p:['Mobile'],tags:['action','mobile'],e:'💥',r:4.6,d:'Console-quality COD experience on mobile with BR, multiplayer and ranked modes.',c:'rgba(239,68,68,0.2),rgba(107,114,128,0.2)',url:'codmobile.html'},
{t:'Fortnite',g:'Battle Royale',p:['PC','Mobile','Console'],tags:['action','mobile','pc','console'],e:'🏗️',r:4.5,d:'The iconic battle royale with constant collaborations, building mechanics and live events.',c:'rgba(96,165,250,0.25),rgba(251,191,36,0.15)',url:'fortnite.html'},
{t:'Cyberpunk 2077',g:'Open World RPG',p:['PC','Console'],tags:['rpg','openworld','pc','console'],e:'🌆',r:4.8,d:'Night City awaits — a sprawling cyberpunk RPG redeemed and now fully realized.',c:'rgba(234,179,8,0.2),rgba(6,182,212,0.15)',url:'cyberpunk.html'},
];

function render(tag){
const list=tag==='all'?games:games.filter(g=>g.tags.includes(tag));
document.getElementById('gg').innerHTML=list.map(g=>`
<div class="gc">
<div class="gc-cover" style="background:linear-gradient(135deg,${g.c});">
<span style="position:relative;z-index:2;">${g.e}</span>
<div class="gc-plat">${g.p.map(p=>`<span class="pt">${p}</span>`).join('')}</div>
</div>
<div class="gc-info">
<div class="gc-genre">${g.g}</div>
<div class="gc-title">${g.t}</div>
<div class="gc-desc">${g.d}</div>
<div class="gc-foot">
<div class="gc-rating"><span class="sr">${'★'.repeat(Math.floor(g.r))}</span><span style="font-size:12px;color:var(--muted)">${g.r}</span></div>
<a href="${g.url}" class="gc-link">View Details →</a>
</div>
</div>
</div>`).join('');
}
render('all');
function filter(tag,btn){document.querySelectorAll('.fb').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render(tag);}
</script>
</body></html>
